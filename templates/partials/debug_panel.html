{% if debug_panel is defined and debug_panel %}
	<div id="tfol-debug" style="
									  position: fixed;
									  right: 12px;
									  bottom: 12px;
									  z-index: 99999;
									  font: 12px/1.4 Arial, sans-serif;
									">
		<div id="tfol-debug-min" style="
									    display:block;
									    background: rgba(0,0,0,0.88);
									    color:#fff;
									    border-radius: 10px;
									    padding: 8px 10px;
									    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
									    cursor:pointer;
									    user-select:none;
									  " onclick="
												    document.getElementById('tfol-debug-panel').style.display='block';
												    document.getElementById('tfol-debug-min').style.display='none';
												  ">
			TFOL Debug (show)
		</div>

		<div id="tfol-debug-panel" style="
				                    display:none;
												    max-width: 560px;
												    width: 560px;
												    background: rgba(0,0,0,0.88);
												    color: #fff;
												    border-radius: 12px;
												    padding: 10px 12px;
												    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
												  ">
			<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
				<div style="font-weight:700;">TFOL Debug Panel (DEV)</div>
				<div>
					<button type="button" onclick="
																		            document.getElementById('tfol-debug-panel').style.display='none';
																		            document.getElementById('tfol-debug-min').style.display='block';
																		          " style="background:transparent; color:#fff; border:1px solid rgba(255,255,255,0.35); border-radius:6px; padding:2px 8px; cursor:pointer; margin-right:6px;">
						minimize
					</button>
					<button type="button" onclick="document.getElementById('tfol-debug').style.display='none';" style="background:transparent; color:#fff; border:1px solid rgba(255,255,255,0.35); border-radius:6px; padding:2px 8px; cursor:pointer;">
						close
					</button>
				</div>
			</div>

			<table style="width:100%; border-collapse:collapse;">
				{% for k, v in debug_panel %}
					<tr>
						<td style="vertical-align:top; padding:3px 6px; opacity:0.75; width: 150px;">
							{{ k }}
						</td>
						<td style="vertical-align:top; padding:3px 6px; word-break:break-word;">
							{{ v }}
						</td>
					</tr>
				{% endfor %}
			</table>
		</div>
	</div>
{% endif %}
