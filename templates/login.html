{% extends 'layout.html' %}

{% block title %}Log In
{% endblock %}
{% block description %}Log in to your account
{% endblock %}

{% block content %}
	<main>
		<section class="form-membership">
			<section class="header">
				<h1>Log in</h1>
			</section>

			<form method="post" action="" autocomplete="on" data-recaptcha-action="login">
				{% if errors.message %}
					<div class="alert alert-danger">{{ errors.message|raw }}</div>
				{% endif %}

				<input type="hidden" name="g-recaptcha-response" value="">
				<input type="hidden" name="website" id="website" value="{{ website.id }}" readonly class="form-control">

				<div class="form-group">
					<label for="login_email">Email</label>
					<input id="login_email" name="email" type="email" autocomplete="username" required>
				</div>

				<div class="form-group">
					<label for="login_password">Password</label>
					<div class="password-wrap">
						<input id="login_password" name="password" type="password" autocomplete="current-password" required>
						<button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false" data-toggle-password="#login_password">👁</button>
					</div>
				</div>

				<button type="submit" class="btn btn-primary">SIGN IN</button>

				<p class="small">
					<a href="/focus-local/public/password-lost/{{ websiteId|default(1) }}">Lost password?</a>
				</p>
			</form>
		</section>
	</main>
{% endblock %}
