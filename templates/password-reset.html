{% extends 'layout.html' %}

{% block content %}
	<main>
		<section class="header">
			<h1>Reset Password</h1>

			{% if success %}
				<div class="alert alert-success">{{ success }}</div>
				<p>
					<a href="{{ doc_root }}login/{{ website.id }}">Go to Login</a>
				</p>
			{% endif %}

			{% if errors.message %}
				<div class="alert alert-danger">{{ errors.message }}</div>
			{% endif %}
		</section>

		{% if validToken %}
			<section class="form-membership">
				<form action="{{ doc_root }}password-reset" method="POST" class="form-membership">
					<input type="hidden" name="token" value="{{ token|e }}">

					<div class="form-group">
						<label for="password">New Password:</label>
						<input type="password" name="password" id="password" class="form-control" autocomplete="new-password" required>
						<div class="errors">{{ errors.password|raw }}</div>
					</div>

					<div class="form-group">
						<label for="confirm">Confirm Password:</label>
						<input type="password" name="confirm" id="confirm" class="form-control" autocomplete="new-password" required>
						<div class="errors">{{ errors.confirm }}</div>
					</div>

					<input type="submit" class="btn btn-primary" value="Reset Password">
				</form>
			</section>
		{% endif %}
	</main>
{% endblock %}
