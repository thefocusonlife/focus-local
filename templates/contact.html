{% extends 'layout.html' %}

{% block content %}
	<main>
		<!-- class="container" id="content"> -->
		<section class="header">
			<h1>Contact us</h1>
		</section>
		<form method="post" action="{{ doc_root }}contact" class="form-contact" data-recaptcha-action="contact">

			{% if errors.warning %}
				<div class="alert alert-danger">{{ errors.warning }}</div>
			{% endif %}
			{% if success %}
				<div class="alert alert-success">
					{{ success|e|nl2br }}
				</div>
			{% endif %}
			<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
			<div class="hp-field" aria-hidden="true">
				<label for="company">Company</label>
				<input type="text" id="company" name="company" value="" tabindex="-1" autocomplete="off">
			</div>

			<div class="form-group">
				<label for="email">Your Email address:
				</label>
				<input type="text" name="email" id="email" value="{{ from }}" class="form-control">
				<span class="errors">{{ errors.email }}</span><br>
			</div>

			<div class="form-group">
				<label for="message">Message:
				</label><br>
				<textarea id="message" name="message" class="form-control">{{ message }}</textarea>
				<span class="errors">{{ errors.message }}</span><br>
			</div>

			{# ⭐ Hidden reCAPTCHA token field #}
			<input type="hidden" name="g-recaptcha-response">

			<input type="submit" value="Submit Message" class="btn">
		</form>

	</main>
{% endblock %}
