<!DOCTYPE html>
<html lang="en-US">
	<head>
		<script src="https://js.chargebee.com/v2/chargebee.js" data-cb-site="thefocusonlife-test"></script>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script src="https://cdn.tiny.cloud/1/{{ TINYMCE_API_KEY }}/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>

		<!-- Initialize TinyMCE with default settings and custom plugins and toolbars  -->

		<script>

			tinymce.init({selector: 'textarea1', branding: false, plugins: 'anchor emoticons  wordcount checklist  ', toolbar: 'undo redo | bold italic underline| spellcheckdialog | align | removeformat'});

// Initialize TinyMCE for textareas with class "tinymce" and a custom toolbar

tinymce.init({
selector: 'textarea.tinymce',
branding: false,

// 🔧 FIX (add these lines)
convert_urls: false,
relative_urls: false,
remove_script_host: false,

plugins: 'anchor autolink  link lists searchreplace table wordcount',
toolbar: 'undo redo | bold italic underline  link |  image table  | spellcheckdialog | align lineheight | checklist numlist bullist indent outdent | emoticons charmap | removeformat'
});
		</script>


		<title>
			{% block title %}theFocusOnLife
			{% endblock %}
		</title>

		<meta name="description" value="{% block description %}HHT Consulting{% endblock %}">
		<link rel="stylesheet" type="text/css" href="{{ doc_root }}css/styles.css">
		<link rel="preconnect" href="https://fonts.gstatic.com">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
		<link rel="shortcut icon" type="image/png" href="{{ doc_root }}img/{{website.image_file}}">

	</head>
	<body oncontextmenu="return true;">

		<header class="header-admin">
			<a class="skip-link" href="#content">Skip to content</a>
			<!-- DEBUG sid={{ session.id|default('NULL') }} role={{ session.role|default('NULL') }} sw={{ session.website|default('NULL') }} -->

			{{ include('partials/nav-utility.html') }}


			<div class="container">
				<div class="logo">
					<a href="{{ doc_root }}"><img src="{{ doc_root }}img/{{website.image_file}}" alt="theFocusOnLife"></a>

				</div>
				<nav>
					<button id="toggle-navigation" aria-expanded="false">
						<span class="icon-menu"></span>
						<span class="hidden">Menu</span>
					</button>

					<ul id="menu">
						<li>
							<a href="{{ doc_root }}admin/stories/" class="nav-item nav-link">Stories</a>
						</li>
						<li>
							<a href="{{ doc_root }}admin/menus/" class="nav-item nav-link">Menus</a>
						</li>
						<li>
							<a href="{{ doc_root }}admin/members" class="nav-item nav-link">Members</a>
						</li>
					</ul>
				</nav>

			</div>
			<!-- /.container -->
		</header>
		{% block content %}{% endblock %}


		<script src="https://cdn.tiny.cloud/1/{{ constant('TINYMCE_API_KEY') }}/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>


		<script>
			if (document.getElementById('story-content')) {
tinymce.init({
selector: 'textarea',
plugins: 'anchor autolink charmap codesample emoticons image link lists media searchreplace table visualblocks wordcount checklist mediaembed casechange export formatpainter pageembed linkchecker a11ychecker tinymcespellchecker permanentpen powerpaste advtable advcode editimage tinycomments tableofcontents footnotes mergetags autocorrect typography inlinecss code',
toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table mergetags | addcomment showcomments | spellcheckdialog a11ycheck typography | align lineheight | checklist numlist bullist indent outdent | emoticons charmap | code | removeformat',

tinycomments_mode: 'embedded',
tinycomments_author: 'Author name',

extended_valid_elements: 'iframe[src|frameborder|style|scrolling|class|width|height|name|align|allow|allowfullscreen|title|loading|referrerpolicy]',
valid_children: '+body[iframe]',
media_live_embeds: true,

mergetags_list: [
{
value: 'First.Name',
title: 'First Name'
}, {
value: 'Email',
title: 'Email'
}
]
});
}
		</script>
		{% include 'partials/footer.html' %}

	</body>
</html>
