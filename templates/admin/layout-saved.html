<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tiny.cloud/1/7tkofysu0j4zom5h6jzs7crranermxfznweam4rf1irmolqf/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
    <script>
      tinymce.init({
        selector: '#mytextarea'
      });
    </script>
    <title>{% block title %}theFocusOnLife{% endblock %}</title>
    <meta name="description" value="{% block description %}HHT Consulting{% endblock %}">
    <link rel="stylesheet" type="text/css" href="{{ doc_root }}css/styles.css">
    <link rel="preconnect" href="https://fonts.gstatic.com"> 
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
    <link rel="shortcut icon" type="image/png" href="{{ doc_root }}img/logo3.png">
 
  </head>
  <body>
    <header class="header-admin">
      <a class="skip-link" href="#content">Skip to content</a>
      <nav class="member-menu">
        <div class="container">
          {% if session.id == 0 %}
            <span class="icon-user"></span><a href="{{ doc_root }}login" class="nav-item nav-link">Log in</a> /
<!--            <span class="icon-user"></span><a href="{{ doc_root }}register" class="nav-item nav-link">Register</a>  ** Remove Register link -->
            
          
          {% else %}
            <span class="icon-user"></span><a href="{{ doc_root }}member/{{ session.id }}">{{ session.forename }}</a> /
            
            {% if session.role == 'admin' %}
              <a href="{{ doc_root }}admin/index">Admin</a> /
            {% endif %}
              <a href="{{ doc_root }}logout">Logout</a> /
              <a href="{{ doc_root }}admin/notes">Notifications</a>
          {% endif %}

        </div>
      </nav>
      <div class="container">
        <div class="logo">
        

          <a href="{{ doc_root }}"><img src="{{ doc_root }}}uploads/{{website.image_file}}" alt="theFocusOnLife"></a>
    <!--    <pre>  {{ dump(doc_root)}} </pre>
    -->   
        </div>
        <nav>
          <button id="toggle-navigation" aria-expanded="false">
            <span class="icon-menu"></span><span class="hidden">Menu</span>
          </button>
          <ul id="menu">
            <li><a href="{{ doc_root }}admin/stories/" class="nav-item nav-link">Stories</a></li>
            <li><a href="{{ doc_root }}admin/menus/" class="nav-item nav-link">Menus</a></li>
            <li><a href="{{ doc_root }}admin/members" class="nav-item nav-link">Members</a></li>
          </ul>
        </nav>
      </div><!-- /.container -->
    </header>
    {% block content %}{% endblock %}
    <footer>
      <div class="container">
        <span class="copyright">&copy; Geoff Stevens {{ 'now'|date('Y') }}</span>
      </div>
    </footer>
<!--  
    <script src="https://cdn.tiny.cloud/1/8hsqe30l6un4uybigsmixlge7buwxb90v2vbavx5yebpnej5/tinymce/5/tinymce.min.js" referrerpolicy="origin"></script>
  --> 
   


 <script src="https://cdn.tiny.cloud/1/7tkofysu0j4zom5h6jzs7crranermxfznweam4rf1irmolqf/6/tinymce.min.js" referrerpolicy="origin"></script>


           
 <script>
    
 if (document.getElementById('story-content')){
  tinymce.init({
    menubar: false,
    selector: '#story-content',
    toolbar: 'bold italic forecolor link h6 alignleft aligncenter alignright print',
      color_map: [
      '000000', 'Black',
      '808080', 'Gray',
      'FFFFFF', 'White',
      'FF0000', 'Red',
      'FFFF00', 'Yellow',
      '008000', 'Green',
      '0000FF', 'Blue'
       ],
    plugins: 'link print',
    target_list: false,
    link_title: false

  });
}
</script>
 <script src="{{ doc_root }}js/site.js"></script>
  </body>
</html>
