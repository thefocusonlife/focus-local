{% extends 'admin/layout.html' %}
{% block content %}
	<main>
		<!-- class="container" id="content">  -->


		<form action="{{ doc_root }}admin/edit-role/{{ member.id }}" method="POST" class="narrow">
			<h1>Edit Role</h1>
			{% if failure %}
				<div class="alert alert-danger">{{ failure }}</div>
			{% endif %}

			{% if success %}
				<div class="alert alert-success">{{ success }}</div>
			{% endif %}

			<p>Member name:
				{{ member.forename }}
				{{ member.surname }}
			</p>Role:
			<select name="role" class="form-control">
				<option value="member" {% if member.role == 'member' %} selected {% endif %}>Member</option>
				<option value="family" {% if member.role == 'family' %} selected {% endif %}>Family</option>
				<option value="admin" {% if member.role == 'admin' %} selected {% endif %}>Admin</option>
				<option value="suspended" {% if member.role == 'suspended' %} selected {% endif %}>Suspended</option>
			</select><br>


			<input type="submit" value="Update role" class="btn btn-primary"/>
		</p>


	</form>
</main>{% endblock %}
