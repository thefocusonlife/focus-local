{% extends 'admin/layout.html' %}
{% block content %}

  <main class="container admin" id="content">
    <form action="{{ doc_root }}admin/story-delete/{{story.id}}" method="POST" class="narrow">
      <h1>Delete Story</h1>

      {% if warning %}<div class="alert alert-danger">{{ warning }}</div>{% endif %}

      <p>Click confirm to delete the story: <em>{{ story.title }}</em></p>
      <input type="submit" name="delete" value="confirm"  class="btn btn-primary" />
      <a href="{{ doc_root }}admin/stories" class="btn btn-danger">cancel</a>
    </form>
  </main>
{% endblock %}
